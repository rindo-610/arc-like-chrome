<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Little Arc ログ</title>
  <link rel="stylesheet" href="little-arc-log.css">
</head>
<body>
  <h1>Little Arc ログと設定</h1>
  <form id="settings">
    <label><input type="checkbox" name="enabled"> 有効</label>
    <label>ウィンドウの種類
      <select name="windowType">
        <option value="popup">popup（タブバーなし）</option>
        <option value="normal">normal（小さい通常ウィンドウ）</option>
      </select>
    </label>
    <label>幅 <input type="number" name="width" min="400" max="2000" step="10"></label>
    <label>高さ <input type="number" name="height" min="300" max="1600" step="10"></label>
    <button type="submit">保存</button>
    <span id="saved" hidden>保存しました</span>
  </form>
  <p id="commands"></p>
  <p>
    <button id="refresh" type="button">再読み込み</button>
    <button id="clear" type="button">ログを消す</button>
  </p>
  <table>
    <thead><tr><th>時刻</th><th>種類</th><th>結果/理由</th><th>URL</th><th>材料</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <h2>JSON</h2>
  <pre id="json"></pre>
  <script src="little-arc-log.js" type="module"></script>
</body>
</html>
